name: Samsung ChatGPT No-Root Green Gate

on:
  pull_request:
    paths:
      - 'pet/**'
      - '.github/workflows/lum-pet-green.yml'
  push:
    branches:
      - chatgpt-inapp-samsung-no-root
    paths:
      - 'pet/**'
      - '.github/workflows/lum-pet-green.yml'

permissions:
  contents: read

jobs:
  green:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compile Python reference tooling
        run: python -m compileall -q pet

      - name: Validate Samsung Android build entrypoint
        run: bash -n pet/godot/jrpg/build-s24fe.sh

      - name: Enforce ChatGPT Samsung no-root doctrine
        run: |
          set -euo pipefail
          test ! -e pet/run-termux.sh
          test ! -e pet/kai-jrpg-supervisor.sh
          grep -q 'const CHATGPT_URL := "https://chatgpt.com/"' pet/godot/jrpg/JRPGCockpit.gd
          grep -q 'No Termux, Shizuku, root, ADB, or localhost daemon required' pet/godot/jrpg/JRPGCockpit.gd
          grep -q 'gradle_build/target_sdk="36"' pet/godot/jrpg/export_presets.cfg
          grep -q 'architectures/arm64-v8a=true' pet/godot/jrpg/export_presets.cfg
          grep -q 'package/unique_name="art.eggiebagelface.kai9000"' pet/godot/jrpg/export_presets.cfg
          ! grep -nE '127\.0\.0\.1|localhost|ACODEX|AcodeX|/data/data/com\.termux|Shizuku|Runtime\.exec|OS\.execute|su -c' pet/godot/jrpg/JRPGCockpit.gd
          ! grep -nE 'permissions/(camera|record_audio|read_external_storage|write_external_storage)=true' pet/godot/jrpg/export_presets.cfg

      - name: Validate imported LuHm ULTIMA contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          policy = json.loads(Path('pet/policy/chatgpt-samsung-no-root.json').read_text())
          upstream = json.loads(Path('pet/manifests/luhmos-ultima-testing-green-20260910.json').read_text())

          assert policy['project'] == 'ChatGPT in-app Samsung no-root'
          assert policy['android_contract']['root_required'] is False
          assert policy['android_contract']['shizuku_required'] is False
          assert policy['android_contract']['termux_required'] is False
          assert policy['android_contract']['target_sdk'] == 36
          assert policy['android_contract']['abi'] == 'arm64-v8a'

          assert upstream['milestone'] == 'LUHMOS_ULTIMA_TESTING_GREEN_20260910'
          assert upstream['source']['commit'] == '7495266b649cdb605cc8f4a67070c265e2770589'
          assert upstream['source']['workflow_run'] == 34556629871
          assert upstream['apk']['package_id'] == 'art.eggiebagelface.luhmos'
          assert upstream['apk']['target_sdk'] == 36
          assert upstream['apk']['abi'] == 'arm64-v8a'
          assert upstream['apk']['sha256'] == 'bb250075b39a3976ce3eea577973ed16cd75c0fbcfbf879676613f87ac286937'
          assert upstream['import_policy']['depend_on_termux_runtime'] is False
          PY

      - name: Validate JRPG Godot project shell
        run: |
          test -f pet/godot/jrpg/project.godot
          test -f pet/godot/jrpg/Main.tscn
          test -f pet/godot/jrpg/JRPGCockpit.gd
          test -f pet/godot/jrpg/LumAvatarStage.gd
          test -f pet/godot/jrpg/OriginalFanfare.gd
          test -f pet/godot/jrpg/export_presets.cfg
          grep -q 'run/main_scene="res://Main.tscn"' pet/godot/jrpg/project.godot
          grep -q 'res://JRPGCockpit.gd' pet/godot/jrpg/Main.tscn
          grep -q 'res://assets/lum/lum.glb' pet/godot/jrpg/LumAvatarStage.gd
          grep -q 'AudioStreamWAV' pet/godot/jrpg/OriginalFanfare.gd

      - name: Run sprite QA baseline
        working-directory: pet
        run: python scripts/qa_pet_atlas.py

      - name: Run Cathedral green gate
        working-directory: pet
        run: python scripts/green_gate.py

      - name: Run JRPG content and rights gate
        working-directory: pet
        run: python scripts/cathedral_content_gate.py

      - name: Run runtime, RPG, quest, save, and HTTP tests
        run: PYTHONPATH=pet python -m unittest discover -s pet/tests -v
