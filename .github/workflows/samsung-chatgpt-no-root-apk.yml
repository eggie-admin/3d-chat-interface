name: Samsung ChatGPT No-Root APK

on:
  workflow_dispatch:
  push:
    branches:
      - chatgpt-inapp-samsung-no-root
    paths:
      - 'pet/godot/jrpg/**'
      - 'pet/policy/chatgpt-samsung-no-root.json'
      - 'pet/manifests/luhmos-ultima-testing-green-20260910.json'
      - '.github/workflows/samsung-chatgpt-no-root-apk.yml'

permissions:
  contents: read

concurrency:
  group: samsung-chatgpt-no-root-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_RELEASE: 4.7.2-stable
  GODOT_TEMPLATE_VERSION: 4.7.2.stable
  GODOT_EDITOR_SHA256: cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4
  GODOT_TEMPLATES_SHA256: f298490b8d44d934be425a5a65a51bf15f422428b229a06a6e11d9ffea248011
  APK_NAME: kai9000-chatgpt-samsung-no-root.apk

jobs:
  android-debug:
    name: Export no-root Samsung companion APK
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platform-tools' 'build-tools;36.1.0' 'platforms;android-36'

      - name: Install verified Godot 4.7.2 export toolchain
        shell: bash
        run: |
          set -euo pipefail
          CACHE="$RUNNER_TEMP/godot-cache"
          WORK="$RUNNER_TEMP/godot-work"
          mkdir -p "$CACHE" "$WORK"

          curl --fail --location --retry 5 --retry-all-errors -o "$CACHE/godot.zip" \
            "https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}/Godot_v4.7.2-stable_linux.x86_64.zip"
          echo "${GODOT_EDITOR_SHA256}  $CACHE/godot.zip" | sha256sum --check --strict

          curl --fail --location --retry 5 --retry-all-errors -o "$CACHE/export_templates.tpz" \
            "https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}/Godot_v4.7.2-stable_export_templates.tpz"
          echo "${GODOT_TEMPLATES_SHA256}  $CACHE/export_templates.tpz" | sha256sum --check --strict

          unzip -q "$CACHE/godot.zip" -d "$WORK"
          chmod +x "$WORK/Godot_v4.7.2-stable_linux.x86_64"
          echo "GODOT_BIN=$WORK/Godot_v4.7.2-stable_linux.x86_64" >> "$GITHUB_ENV"

          unzip -q "$CACHE/export_templates.tpz" -d "$WORK/templates"
          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/${GODOT_TEMPLATE_VERSION}"
          mkdir -p "$TEMPLATE_DIR"
          cp -a "$WORK/templates/templates/." "$TEMPLATE_DIR/"
          test -f "$TEMPLATE_DIR/android_debug.apk"
          test -f "$TEMPLATE_DIR/android_source.zip"

      - name: Configure Android editor settings and ephemeral signer
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF

          KEYSTORE="$RUNNER_TEMP/kai9000-chatgpt-debug.keystore"
          keytool -genkeypair -keystore "$KEYSTORE" -storepass android \
            -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 \
            -validity 10000 -dname 'CN=KAI 9000 ChatGPT No Root Testing,O=Eggie Bagelface Art,C=US'
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$KEYSTORE" >> "$GITHUB_ENV"
          echo 'GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey' >> "$GITHUB_ENV"
          echo 'GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android' >> "$GITHUB_ENV"

      - name: Validate no-root source contract
        shell: bash
        run: |
          set -euo pipefail
          python pet/scripts/green_gate.py
          test ! -e pet/run-termux.sh
          test ! -e pet/kai-jrpg-supervisor.sh
          ! grep -nE '127\.0\.0\.1|ACODEX|AcodeX|/data/data/com\.termux|Runtime\.exec|OS\.execute|su -c' pet/godot/jrpg/JRPGCockpit.gd

      - name: Import and export Android testing APK
        shell: bash
        run: |
          set -euo pipefail
          PROJECT="$GITHUB_WORKSPACE/pet/godot/jrpg"
          mkdir -p "$PROJECT/build"
          "$GODOT_BIN" --headless --editor --path "$PROJECT" --quit
          "$GODOT_BIN" --headless --path "$PROJECT" \
            --install-android-build-template \
            --export-debug 'Samsung ChatGPT No Root' \
            "$PROJECT/build/$APK_NAME"
          test -s "$PROJECT/build/$APK_NAME"

      - name: Verify APK identity and Android safety contract
        shell: bash
        run: |
          set -euo pipefail
          APK="pet/godot/jrpg/build/$APK_NAME"
          TOOLS="$ANDROID_HOME/build-tools/36.1.0"
          mkdir -p build/apk-evidence
          "$TOOLS/apksigner" verify --verbose --print-certs "$APK" | tee build/apk-evidence/signature.txt
          "$TOOLS/zipalign" -c -P 16 -v 4 "$APK" | tee build/apk-evidence/zipalign.txt
          "$TOOLS/aapt" dump badging "$APK" | tee build/apk-evidence/badging.txt
          "$TOOLS/aapt" dump permissions "$APK" | tee build/apk-evidence/permissions.txt
          sha256sum "$APK" | tee build/apk-evidence/sha256.txt

          grep -q "package: name='art.eggiebagelface.kai9000'" build/apk-evidence/badging.txt
          grep -q "versionCode='100'" build/apk-evidence/badging.txt
          grep -q "versionName='1.0.0'" build/apk-evidence/badging.txt
          grep -q "application-label:'KAI 9000 ChatGPT Companion'" build/apk-evidence/badging.txt
          grep -q "targetSdkVersion:'36'" build/apk-evidence/badging.txt
          grep -q "native-code: 'arm64-v8a'" build/apk-evidence/badging.txt
          grep -Eq 'Verified using v(2|3|4) scheme .*: true' build/apk-evidence/signature.txt
          grep -q 'android.permission.INTERNET' build/apk-evidence/permissions.txt
          ! grep -Eq 'android.permission.(CAMERA|RECORD_AUDIO|READ_EXTERNAL_STORAGE|WRITE_EXTERNAL_STORAGE)' build/apk-evidence/permissions.txt
          echo 'KAI9000_CHATGPT_SAMSUNG_NO_ROOT_APK_GREEN'

      - name: Upload APK evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kai9000-chatgpt-samsung-no-root-${{ github.run_number }}
          path: |
            pet/godot/jrpg/build/${{ env.APK_NAME }}
            build/apk-evidence/**
            pet/policy/chatgpt-samsung-no-root.json
            pet/manifests/luhmos-ultima-testing-green-20260910.json
          if-no-files-found: error
          retention-days: 14
