name: Lum Pet Green Gate

on:
  pull_request:
    paths:
      - 'pet/**'
      - '.github/workflows/lum-pet-green.yml'
  push:
    branches:
      - lum-pet-cathedral-20260906
      - kai9000-s24fe-avatar-cockpit-20260906
      - kai9000-jrpg-dating-cathedral-20260906
    paths:
      - 'pet/**'
      - '.github/workflows/lum-pet-green.yml'

permissions:
  contents: read

jobs:
  green:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compile Python
        run: python -m compileall -q pet

      - name: Validate Termux and Android launchers
        run: |
          bash -n pet/run-termux.sh
          bash -n pet/kai-jrpg-supervisor.sh
          bash -n pet/godot/jrpg/build-s24fe.sh

      - name: Validate JRPG Godot project shell
        run: |
          test -f pet/godot/jrpg/project.godot
          test -f pet/godot/jrpg/Main.tscn
          test -f pet/godot/jrpg/JRPGCockpit.gd
          test -f pet/godot/jrpg/LumAvatarStage.gd
          test -f pet/godot/jrpg/OriginalFanfare.gd
          test -f pet/godot/jrpg/export_presets.cfg
          test -f pet/godot/jrpg/CathedralDirector.gd
          test -f pet/godot/jrpg/DatingDirector.gd
          test -f pet/godot/jrpg/RoleplayDirector.gd
          test -f pet/godot/jrpg/BattleDirector.gd
          test -f pet/godot/jrpg/OverworldMap.gd
          test -f pet/godot/jrpg/OverworldMap.tscn
          test -f pet/godot/jrpg/AnimationTaxonomy.gd
          test -f pet/godot/jrpg/data/cathedral_content.json
          grep -q 'run/main_scene="res://Main.tscn"' pet/godot/jrpg/project.godot
          grep -q 'CathedralDirector="\*res://CathedralDirector.gd"' pet/godot/jrpg/project.godot
          grep -q 'DatingDirector="\*res://DatingDirector.gd"' pet/godot/jrpg/project.godot
          grep -q 'http://127.0.0.1:8772' pet/godot/jrpg/JRPGCockpit.gd
          grep -q 'ACODEX // COMMAND MENU' pet/godot/jrpg/JRPGCockpit.gd
          grep -q 'res://assets/lum/lum.glb' pet/godot/jrpg/LumAvatarStage.gd
          grep -q 'AudioStreamWAV' pet/godot/jrpg/OriginalFanfare.gd
          grep -q 'architectures/arm64-v8a=true' pet/godot/jrpg/export_presets.cfg
          ! grep -R -nE '0\.0\.0\.0|:22\b|OS\.execute|Process|Runtime\.exec' pet/godot/jrpg

      - name: Run sprite QA baseline
        working-directory: pet
        run: python scripts/qa_pet_atlas.py

      - name: Run Cathedral green gate
        working-directory: pet
        run: python scripts/green_gate.py

      - name: Run JRPG content and rights gate
        working-directory: pet
        run: python scripts/cathedral_content_gate.py

      - name: Run runtime, RPG, quest, save, and HTTP tests
        run: PYTHONPATH=pet python -m unittest discover -s pet/tests -v
