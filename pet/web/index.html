<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tiny Lum Pet Cathedral</title>
<style>
:root{color-scheme:dark;font-family:system-ui,sans-serif;background:#111;color:#eee}
body{max-width:760px;margin:0 auto;padding:24px}.pet{display:grid;gap:18px}
.stage{min-height:300px;border:1px solid #444;border-radius:18px;display:grid;place-items:center;background:radial-gradient(circle at 50% 35%,#2d2430,#111)}
.sprite{width:160px;height:160px;border-radius:50%;display:grid;place-items:center;border:2px solid #777;font-size:64px;user-select:none}
.controls{display:flex;flex-wrap:wrap;gap:10px}button{font:inherit;padding:12px 14px;border-radius:10px;border:1px solid #555;background:#222;color:#fff}
pre{white-space:pre-wrap;background:#0b0b0b;padding:14px;border-radius:10px}.note{color:#aaa;font-size:.92rem}
</style>
<div class="pet">
  <h1>Tiny Lum Pet Cathedral ⚡😈</h1>
  <p class="note">Local cockpit. The emoji is a placeholder until the approved Lum atlas is mounted.</p>
  <div class="stage"><div class="sprite" id="sprite">⚡😈</div></div>
  <div class="controls" id="controls"></div>
  <pre id="state">loading…</pre>
</div>
<script>
const events=["tap","double_tap","praise","message","ignore","focus","jump","sleep","wake","reset"];
const controls=document.querySelector("#controls"),out=document.querySelector("#state"),sprite=document.querySelector("#sprite");
for(const event of events){const b=document.createElement("button");b.textContent=event;b.addEventListener("click",()=>send(event));controls.appendChild(b)}
async function load(){const r=await fetch("/api/pet/state");render(await r.json())}
async function send(event){const r=await fetch("/api/pet/event",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({event})});render(await r.json())}
function render(s){out.textContent=JSON.stringify(s,null,2);const icons={sleep:"💤",jealous:"⚡😒",happy:"⚡😈",sad:"🥺",cute:"😈✨",smug:"😏⚡",angry:"😠⚡"};sprite.textContent=s.state==="sleep"?icons.sleep:(icons[s.mood]||"⚡😈")}
load().catch(err=>out.textContent=String(err));
</script>
